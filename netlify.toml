[build]
  # We add the install command with the 'no-frozen-lockfile' flag
  command = "pnpm install --no-frozen-lockfile && pnpm --filter frontend run build"
  publish = "frontend/.next"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://your-backend-url.onrender.com/api"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
