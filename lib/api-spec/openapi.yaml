openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Situation X - AI + Astrology Situation Analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: analysis
  - name: feedback
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analysis/estimate:
    post:
      operationId: estimateAnalysisCost
      tags: [analysis]
      summary: Exact credit cost of analysing this situation (modules involved + reasoning level), before anything is charged
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Cost breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostEstimate"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/analyze:
    post:
      operationId: analyzeSituation
      tags: [analysis]
      summary: Analyze a situation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Not enough credits (the body carries the price and the balance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientCreditsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/history:
    get:
      operationId: getAnalysisHistory
      tags: [analysis]
      summary: Get analysis history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: History list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisHistoryResponse"

  /analysis/history/{id}:
    get:
      operationId: getAnalysisById
      tags: [analysis]
      summary: Get analysis by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRecord"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnalysis
      tags: [analysis]
      summary: Delete an analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/followups/due:
    get:
      operationId: getDueFollowUps
      tags: [analysis]
      summary: Predictions whose time window has passed and are waiting for the user's feedback
      responses:
        "200":
          description: Due follow-ups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueFollowUpsResponse"

  /analysis/history/{id}/followup/snooze:
    post:
      operationId: snoozeFollowUp
      tags: [analysis]
      summary: Ask again later
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Snoozed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/history/{id}/followup/dismiss:
    post:
      operationId: dismissFollowUp
      tags: [analysis]
      summary: Never ask about this prediction again
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: Subscription plans with the full price breakdown (INR)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlansResponse"

  /billing/status:
    get:
      operationId: getSubscriptionStatus
      tags: [billing]
      summary: The signed-in user's subscription
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"

  /billing/credits:
    get:
      operationId: getCredits
      tags: [billing]
      summary: Credit balance and recent credit history of the signed-in user
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsResponse"

  /billing/order:
    post:
      operationId: createBillingOrder
      tags: [billing]
      summary: Start a Razorpay checkout for a plan, a top-up pack or a single-query credit purchase (the amount is computed on the server)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Razorpay order to open in Checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Unknown or ambiguous product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Top-up packs need an active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payments not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /billing/verify:
    post:
      operationId: verifyBillingPayment
      tags: [billing]
      summary: Confirm a Checkout payment (verifies Razorpay's signature) and activate the subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPaymentRequest"
      responses:
        "200":
          description: Updated subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "400":
          description: Signature mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit feedback for an analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackItem"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getFeedbackList
      tags: [feedback]
      summary: Get all feedback (optionally filtered by analysis)
      parameters:
        - name: analysisId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Feedback list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"

  /feedback/{id}:
    delete:
      operationId: deleteFeedback
      tags: [feedback]
      summary: Delete feedback
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnalyzeRequest:
      type: object
      properties:
        situation:
          type: string
          description: The situation to analyze (min 10 characters)
        latitude:
          type: number
          description: Optional latitude of where the question is asked (default New Delhi). Only refines the Prashna ascendant; no birth details are needed.
        longitude:
          type: number
          description: Optional longitude of where the question is asked (default New Delhi)
        depth:
          type: string
          enum: [auto, standard, deep, expert]
          description: How deeply the AI should reason. "auto" (default) picks the level from how complex the question is. Deeper levels cost more credits.
      required:
        - situation

    IntentResult:
      type: object
      properties:
        intent:
          type: string
          enum: [decision, relationship, conflict, career, health, unclear]
        confidence:
          type: string
          enum: [low, medium, high]
        score:
          type: number
      required:
        - intent
        - confidence
        - score

    EmotionResult:
      type: object
      properties:
        emotion:
          type: string
          enum: [calm, stressed, anxious, angry, sad, confused]
        intensity:
          type: string
          enum: [low, medium, high]
        score:
          type: number
      required:
        - emotion
        - intensity
        - score

    PathOption:
      type: object
      properties:
        action:
          type: string
        risk:
          type: string
          enum: [low, medium, high]
        stability:
          type: string
          enum: [low, medium, high]
        outcome:
          type: string
          enum: [positive, negative, mixed]
      required:
        - action
        - risk
        - stability
        - outcome

    SimulationResult:
      type: object
      properties:
        bestPath:
          $ref: "#/components/schemas/PathOption"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/PathOption"
      required:
        - bestPath
        - alternatives

    FinalVerdict:
      type: object
      properties:
        recommendedAction:
          type: string
        reasoning:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high]
      required:
        - recommendedAction
        - reasoning
        - riskLevel

    PlanetPosition:
      type: object
      properties:
        name:
          type: string
        longitude:
          type: number
        sign:
          type: string
        signIndex:
          type: integer
        degree:
          type: number
        isRetrograde:
          type: boolean
        navamsaSign:
          type: string
        dasamsaSign:
          type: string
        drekkanaSign:
          type: string
        house:
          type: integer
          description: House (1-12, whole sign) counted from this chart's own lagna
        dignity:
          type: string
          enum: [exalted, own, debilitated, neutral]
      required:
        - name
        - longitude
        - sign
        - signIndex
        - degree
        - isRetrograde
        - navamsaSign
        - dasamsaSign

    DashaLevel:
      type: object
      properties:
        planet:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        years:
          type: number
      required:
        - planet
        - startDate
        - endDate
        - years

    DashaTree:
      type: object
      properties:
        mahadasha:
          $ref: "#/components/schemas/DashaLevel"
        antardasha:
          $ref: "#/components/schemas/DashaLevel"
        pratyantardasha:
          $ref: "#/components/schemas/DashaLevel"
        sookshmadasha:
          $ref: "#/components/schemas/DashaLevel"
      required:
        - mahadasha

    VedicChart:
      type: object
      properties:
        ascendant:
          type: string
        ascendantDegree:
          type: number
        planets:
          type: array
          items:
            $ref: "#/components/schemas/PlanetPosition"
        currentDasha:
          $ref: "#/components/schemas/DashaTree"
        ayanamsa:
          type: number
        chartType:
          type: string
          description: "D1, D3, D9, or D10"
      required:
        - ascendant
        - ascendantDegree
        - planets
        - ayanamsa
        - chartType

    PrashnaFactor:
      type: object
      properties:
        label:
          type: string
        effect:
          type: number
        detail:
          type: string
      required:
        - label
        - effect
        - detail

    PrashnaChartUse:
      type: object
      properties:
        chart:
          type: string
        purpose:
          type: string
        note:
          type: string
      required:
        - chart
        - purpose
        - note

    PrashnaReading:
      type: object
      description: Prashna (horary) chart cast for the moment of the question, read for the question type
      properties:
        castAt:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        lagna:
          type: string
        lagnaLord:
          type: string
        moonSign:
          type: string
        moonNakshatra:
          type: string
        moonWaxing:
          type: boolean
        topic:
          type: string
        primaryHouse:
          type: integer
        chartsUsed:
          type: array
          items:
            $ref: "#/components/schemas/PrashnaChartUse"
        factors:
          type: array
          items:
            $ref: "#/components/schemas/PrashnaFactor"
        score:
          type: number
        signal:
          type: string
          enum: [favorable, challenging, neutral]
        stability:
          type: string
          enum: [low, medium, high]
        risk:
          type: string
          enum: [low, medium, high]
        dominantPlanet:
          type: string
        summary:
          type: string
      required:
        - castAt
        - lagna
        - lagnaLord
        - moonSign
        - moonNakshatra
        - moonWaxing
        - topic
        - primaryHouse
        - chartsUsed
        - factors
        - score
        - signal
        - summary

    AstroInfluence:
      type: object
      properties:
        dominantPlanet:
          type: string
        stability:
          type: string
          enum: [low, medium, high]
        risk:
          type: string
          enum: [low, medium, high]
        signal:
          type: string
          enum: [favorable, challenging, neutral]
      required:
        - dominantPlanet
        - stability
        - risk
        - signal

    AstroResult:
      type: object
      properties:
        influence:
          $ref: "#/components/schemas/AstroInfluence"
        interpretation:
          type: string
        vedicD1:
          $ref: "#/components/schemas/VedicChart"
        vedicD3:
          $ref: "#/components/schemas/VedicChart"
        prashna:
          $ref: "#/components/schemas/PrashnaReading"
        vedicD9:
          $ref: "#/components/schemas/VedicChart"
        vedicD10:
          $ref: "#/components/schemas/VedicChart"
      required:
        - influence
        - interpretation

    AnalysisResult:
      type: object
      properties:
        id:
          type: integer
        situation:
          type: string
        intent:
          $ref: "#/components/schemas/IntentResult"
        emotion:
          $ref: "#/components/schemas/EmotionResult"
        simulation:
          $ref: "#/components/schemas/SimulationResult"
        finalVerdict:
          $ref: "#/components/schemas/FinalVerdict"
        astro:
          $ref: "#/components/schemas/AstroResult"
        overallScore:
          type: number
        summary:
          type: string
        synthesis:
          $ref: "#/components/schemas/Synthesis"
        credits:
          $ref: "#/components/schemas/CreditsUsed"
        followUpAt:
          type: string
          description: When the app will ask how the prediction turned out
        createdAt:
          type: string
      required:
        - id
        - situation
        - intent
        - emotion
        - simulation
        - finalVerdict
        - astro
        - overallScore
        - summary
        - createdAt

    Synthesis:
      type: object
      description: Final answer produced by the AI working together with the astrology and the AJIT/MANU/SIVI modules
      properties:
        verdict:
          type: string
          enum: [YES, CONDITIONAL, NO]
        score:
          type: number
        confidence:
          type: string
          enum: [low, medium, high]
        summary:
          type: string
        astroInsight:
          type: string
        advice:
          type: string
        timeframeDays:
          type: integer
        source:
          type: string
          enum: [ai+astro, engine]
        calibration:
          $ref: "#/components/schemas/Calibration"
        logicScore:
          type: number
          description: The AI's own merit-based score (0-100), before the astrology was weighed in
        astroScore:
          type: number
          description: The Prashna astrology verdict as a 0-100 score
        astroAlignment:
          type: string
          enum: [supports, mixed, contradicts]
          description: How the astrology verdict relates to the AI's own judgment
        reasoning:
          type: string
          description: The AI's reasoning about the situation itself
        risks:
          type: array
          items:
            type: string
        keyUnknowns:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string
        weights:
          type: object
          description: Weights used to blend the AI judgment and the astrology verdict
          properties:
            logic:
              type: number
            astro:
              type: number
          required:
            - logic
            - astro
      required:
        - verdict
        - score
        - confidence
        - summary
        - astroInsight
        - advice
        - timeframeDays
        - source

    Calibration:
      type: object
      description: How accurate past predictions of this kind were, according to user follow-ups
      properties:
        samples:
          type: integer
        hitRate:
          type: number
        applied:
          type: boolean
      required:
        - samples
        - hitRate
        - applied

    AnalysisRecord:
      type: object
      properties:
        id:
          type: integer
        situation:
          type: string
        intent:
          type: string
        emotion:
          type: string
        overallScore:
          type: number
        riskLevel:
          type: string
        summary:
          type: string
        fullAnalysis:
          $ref: "#/components/schemas/AnalysisResult"
        createdAt:
          type: string
      required:
        - id
        - situation
        - intent
        - emotion
        - overallScore
        - riskLevel
        - summary
        - createdAt

    AnalysisHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisRecord"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    DueFollowUp:
      type: object
      properties:
        id:
          type: integer
        situation:
          type: string
        summary:
          type: string
        verdict:
          type: string
        createdAt:
          type: string
      required:
        - id
        - situation
        - summary
        - verdict
        - createdAt

    DueFollowUpsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DueFollowUp"
        total:
          type: integer
      required:
        - items
        - total

    BillingQuote:
      type: object
      description: Price breakdown of one plan. All money values are integer paise (INR).
      properties:
        planId:
          type: string
          enum: [monthly, six_months, yearly, two_years]
        label:
          type: string
        months:
          type: integer
        currency:
          type: string
        monthlyPaise:
          type: integer
        grossPaise:
          type: integer
        discountPct:
          type: number
        discountPaise:
          type: integer
        gstPct:
          type: number
        gstPaise:
          type: integer
        totalPaise:
          type: integer
        effectivePerMonthPaise:
          type: integer
        credits:
          type: integer
          description: Credits added to the wallet when this plan is paid
      required:
        - credits
        - planId
        - label
        - months
        - currency
        - monthlyPaise
        - grossPaise
        - discountPct
        - discountPaise
        - gstPct
        - gstPaise
        - totalPaise
        - effectivePerMonthPaise

    BillingPlansResponse:
      type: object
      properties:
        currency:
          type: string
        paywallEnabled:
          type: boolean
        plans:
          type: array
          items:
            $ref: "#/components/schemas/BillingQuote"
        packs:
          type: array
          description: Top-up packs (subscribers only)
          items:
            $ref: "#/components/schemas/CreditPackQuote"
        single:
          $ref: "#/components/schemas/SingleQueryRate"
        costs:
          $ref: "#/components/schemas/CostTable"
      required:
        - currency
        - paywallEnabled
        - plans
        - packs
        - single
        - costs

    CreditPackQuote:
      type: object
      description: Price of a credit-only purchase. All money values are integer paise (INR).
      properties:
        kind:
          type: string
          enum: [topup, single]
        packId:
          type: string
          nullable: true
          enum: [topup_100, topup_300, topup_1000]
        credits:
          type: integer
        currency:
          type: string
        grossPaise:
          type: integer
        discountPct:
          type: number
        discountPaise:
          type: integer
        gstPct:
          type: number
        gstPaise:
          type: integer
        totalPaise:
          type: integer
        perCreditPaise:
          type: integer
      required: [kind, packId, credits, currency, grossPaise, discountPct, discountPaise, gstPct, gstPaise, totalPaise, perCreditPaise]

    SingleQueryRate:
      type: object
      description: Credits bought without a subscription, at a higher per-credit price
      properties:
        minCredits:
          type: integer
        maxCredits:
          type: integer
        perCreditPaise:
          type: integer
      required: [minCredits, maxCredits, perCreditPaise]

    CostTableRow:
      type: object
      properties:
        label:
          type: string
        credits:
          type: integer
      required: [label, credits]

    CostTable:
      type: object
      description: What each module and each reasoning level costs
      properties:
        modules:
          type: array
          items:
            $ref: "#/components/schemas/CostTableRow"
        ai:
          type: array
          items:
            $ref: "#/components/schemas/CostTableRow"
      required: [modules, ai]

    CostLine:
      type: object
      properties:
        key:
          type: string
          enum: [astro, ajit, manu, sivi, ai]
        label:
          type: string
        credits:
          type: integer
        note:
          type: string
      required: [key, label, credits, note]

    CostEstimate:
      type: object
      properties:
        total:
          type: integer
        aiCredits:
          type: integer
        depth:
          type: string
          enum: [standard, deep, expert]
        depthChosen:
          type: string
          enum: [auto, user]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CostLine"
        billingActive:
          type: boolean
          description: False while credits are not being charged (everything is free)
        balance:
          type: integer
        enough:
          type: boolean
      required: [total, aiCredits, depth, depthChosen, lines, billingActive, balance, enough]

    CreditsUsed:
      type: object
      description: What this analysis cost. charged is 0 while billing is off.
      properties:
        billingActive:
          type: boolean
        charged:
          type: integer
        balance:
          type: integer
          nullable: true
        depth:
          type: string
          enum: [standard, deep, expert]
        depthChosen:
          type: string
          enum: [auto, user]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CostLine"
      required: [billingActive, charged, balance, depth, depthChosen, lines]

